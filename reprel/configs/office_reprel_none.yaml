# Office World, condition "reprel_none". Tasks: deliver_mail | deliver_coffee | deliver_both | visit_abcd
# (override with --set domain.task=...). Rewards: -1/step, -10 invalid move or plant, +100 at goal.
name: office_deliver_mail
condition: reprel_none
domain: {name: office, task: deliver_mail, max_steps: 300}
abstraction: {name: dfoci, spec: office}
agent: {alpha: 0.1, gamma: 0.99, terminal_reward: 100.0}
epsilon: {schedule: linear, start: 0.75, end: 0.01, episodes: 500}
training: {total_steps: 200000, eval_every: 5000, eval_episodes: 20, eval_epsilon: 0.01}
seeds: [0, 1, 2, 3, 4]
output_dir: outputs
