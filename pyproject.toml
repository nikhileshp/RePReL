[project]
name = "reprel"
version = "0.1.0"
description = "RePReL: Relational Planning and Reinforcement Learning with D-FOCI state abstractions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nikhilesh Prabhakar", email = "prabhakar.nikhilesh@gmail.com" }]
dependencies = [
    "gtpyhop>=2.0.2",
    "numpy>=1.26",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reprel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
